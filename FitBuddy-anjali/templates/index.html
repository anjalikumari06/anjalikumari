<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy ⚡ AI Workout Generator</title>
    <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, rgba(10, 15, 30, 0.82), rgba(3, 7, 18, 0.90)),
                        url('/static/images/gym-bg.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
            color: #0f172a;
        }

        .card-container {
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(18px);
            border-radius: 24px;
            box-shadow: 0 25px 65px -12px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.85);
            padding: 38px 34px;
            animation: slideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(22px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Brand & Logo Sticker Section */
        .brand-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #e0f2fe, #ccfbf1);
            color: #0f766e;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(15, 118, 110, 0.12);
        }

        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.95rem;
            font-weight: 800;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: -0.5px;
        }

        .brand-title span.highlight {
            background: linear-gradient(135deg, #0284c7, #0d9488);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            color: #64748b;
            font-size: 0.92rem;
            margin-top: 6px;
            font-weight: 400;
        }

        /* Form Group Styles */
        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 7px;
        }

        .label-sticker {
            font-size: 1.1rem;
        }

        .form-input {
            width: 100%;
            padding: 13px 15px;
            font-size: 0.94rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            background-color: #f8fafc;
            color: #0f172a;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .form-input::placeholder {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .form-input:focus {
            border-color: #0284c7;
            background-color: #ffffff;
            box-shadow: 0 0 0 3.5px rgba(2, 132, 199, 0.16);
        }

        select.form-input {
            cursor: pointer;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        /* High Energy Submit Button */
        .btn-generate {
            width: 100%;
            background: linear-gradient(135deg, #0284c7, #0f766e);
            color: #ffffff;
            border: none;
            padding: 15px;
            font-size: 1.02rem;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 0.3px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px -4px rgba(2, 132, 199, 0.45);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-generate:hover {
            background: linear-gradient(135deg, #0369a1, #115e59);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -4px rgba(2, 132, 199, 0.55);
        }

        .btn-generate:active {
            transform: translateY(0);
        }

        /* Footer Link */
        .footer-nav {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-link {
            color: #475569;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav-link:hover {
            background: #f1f5f9;
            color: #0284c7;
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2.5px solid #ffffff;
            border-top: 2.5px solid transparent;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Modal Overlay & Box */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .modal-box {
            background: #ffffff;
            width: 90%;
            max-width: 420px;
            border-radius: 18px;
            padding: 30px 24px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            border: 1px solid #f1f5f9;
        }

        .modal-sticker {
            font-size: 3.2rem;
            margin-bottom: 12px;
            line-height: 1;
            display: inline-block;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-6px); }
        }

        .modal-box h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.35rem;
            color: #e11d48;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .modal-box p {
            font-size: 0.92rem;
            color: #475569;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .modal-box code {
            background: #f1f5f9;
            color: #0f172a;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
            font-family: monospace;
            font-size: 0.88rem;
            border: 1px solid #e2e8f0;
        }

        .btn-modal {
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-modal:hover {
            background: #0369a1;
            transform: scale(1.02);
        }

        @media (max-width: 480px) {
            .card-container {
                padding: 28px 20px;
            }
            .grid-2 {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Logo / Title Header with Stickers -->
        <div class="brand-header">
            <div class="brand-badge">
                <span>⚡ Powered by Google Gemini AI</span>
            </div>
            <h1 class="brand-title">
                <span>🏋️‍♂️</span> Fit<span class="highlight">Buddy</span> <span>✨</span>
            </h1>
            <p class="brand-subtitle">Smart 7-Day Fitness Routines & Nutrition Tips</p>
        </div>

        <!-- Workout Form -->
        <form action="/generate-workout" method="POST" id="workoutForm" onsubmit="return handleWorkoutSubmit(event)">
            <div class="form-group">
                <label for="username" class="form-label">
                    <span class="label-sticker">👤</span> Your Full Name:
                </label>
                <input type="text" id="username" name="username" class="form-input" placeholder="e.g., Alex Johnson / Sarah Connor" required>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="user_id" class="form-label">
                        <span class="label-sticker">🆔</span> User ID:
                    </label>
                    <input type="number" id="user_id" name="user_id" class="form-input" placeholder="e.g., 101" min="1" required>
                </div>
                <div class="form-group">
                    <label for="age" class="form-label">
                        <span class="label-sticker">🎂</span> Age:
                    </label>
                    <input type="number" id="age" name="age" class="form-input" placeholder="e.g., 24 years" min="10" max="100" required>
                </div>
            </div>

            <div class="form-group">
                <label for="weight" class="form-label">
                    <span class="label-sticker">⚖️</span> Body Weight (kg):
                </label>
                <input type="number" step="0.1" id="weight" name="weight" class="form-input" placeholder="e.g., 72.5 kg" min="20" max="300" required>
            </div>

            <div class="form-group">
                <label for="goal" class="form-label">
                    <span class="label-sticker">🎯</span> Fitness Goal:
                </label>
                <input type="text" id="goal" name="goal" list="goal-suggestions" class="form-input" placeholder="e.g., Build lean muscle & six-pack abs / Burn belly fat" required>
                <datalist id="goal-suggestions">
                    <option value="Muscle gain & hypertrophy">
                    <option value="Fat loss & core definition">
                    <option value="Full body flexibility & mobility">
                    <option value="Athletic conditioning & endurance">
                    <option value="General health & daily wellness">
                </datalist>
            </div>

            <div class="form-group">
                <label for="intensity" class="form-label">
                    <span class="label-sticker">🔥</span> Workout Intensity:
                </label>
                <select id="intensity" name="intensity" class="form-input" required>
                    <option value="Low">🌱 Low (Gentle & Recovery Focus)</option>
                    <option value="Medium" selected>⚡ Medium (Balanced & Steady)</option>
                    <option value="High">🔥 High (Challenging & Intense)</option>
                </select>
            </div>

            <button type="submit" class="btn-generate" id="submitBtn">
                <span class="spinner" id="spinner"></span>
                <span id="btnText">✨ Generate 7-Day Plan</span>
            </button>
        </form>

        <div class="footer-nav">
            <a href="/view-all-users" class="nav-link">
                <span>📊</span> View All Users & Admin Dashboard
            </a>
        </div>
    </div>

    <!-- API Key Popup Modal -->
    <div id="apiKeyModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-sticker">⚠️</div>
            <h3>API Key Not Found</h3>
            <p>Google Gemini API Key is missing.<br>Please set your <code>GOOGLE_API_KEY</code> in the <code>.env</code> file before generating a workout plan.</p>
            <button type="button" class="btn-modal" onclick="closeApiKeyModal()">Got It, I'll Add It</button>
        </div>
    </div>

    <script>
        const initialHasApiKey = {{ 'true' if has_api_key else 'false' }};

        function showApiKeyPopup() {
            const modal = document.getElementById('apiKeyModal');
            if (modal) {
                modal.style.display = 'flex';
            } else {
                alert("⚠️ API Key Not Found!\n\nPlease set your GOOGLE_API_KEY in the .env file before generating a workout plan.");
            }
        }

        function closeApiKeyModal() {
            const modal = document.getElementById('apiKeyModal');
            if (modal) {
                modal.style.display = 'none';
            }
        }

        async function handleWorkoutSubmit(event) {
            try {
                const response = await fetch('/api/check-api-key');
                const result = await response.json();
                if (!result.configured) {
                    event.preventDefault();
                    showApiKeyPopup();
                    return false;
                }
            } catch (err) {
                if (!initialHasApiKey) {
                    event.preventDefault();
                    showApiKeyPopup();
                    return false;
                }
            }

            const btn = document.getElementById('submitBtn');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btnText');
            spinner.style.display = 'inline-block';
            btnText.textContent = 'Crafting with Gemini AI...';
            btn.style.opacity = '0.85';
            btn.style.pointerEvents = 'none';
            return true;
        }
    </script>
</body>
</html>
